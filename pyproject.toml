[project]
name = "llm-classification-finetuning"
version = "0.1.0"
description = "LLM Classification Finetuning task from Kaggle"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dvc>=3.64.2",
    "fire>=0.7.1",
    "hydra-core>=1.3.2",
    "kagglehub>=0.3.13",
    "lightning>=2.6.0",
    "mlflow>=3.7.0",
    "pandas>=2.3.3",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.2.0",
    "tensorboard>=2.20.0",
    "torch>=2.9.1",
    "torchmetrics>=1.8.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
    "ruff>=0.14.9",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F", "E", "W", "I", "RUF"]
ignore = ["RUF002"]

[tool.ruff.format]
quote-style = "single"
